name: SodoNetwork Reproducible Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Mutation Guard vs. py_compile (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install official PyPI package (sodonetwork==3.6.1)
        run: python -m pip install --upgrade pip && pip install sodonetwork==3.6.1

      - name: Execute Reproducible Stdlib Corpus Benchmark
        run: python benchmarks/run_benchmark.py --out-dir results

      - name: Publish Benchmark Report to GitHub Job Summary
        shell: bash
        run: cat results/BENCHMARK_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Raw JSON/CSV/Markdown Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            results/latest_results.json
            results/latest_cases.csv
            results/BENCHMARK_REPORT.md
